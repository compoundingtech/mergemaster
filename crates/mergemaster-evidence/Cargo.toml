[package]
name = "mergemaster-evidence"
version = "0.7.0"
edition = "2024"
description = "Portable signed gate observations in immutable Git notes"
license = "MIT"
autotests = false

[[bin]]
name = "mergemaster"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "gate"
path = "tests/gate.rs"

[[test]]
name = "workspace_inputs"
path = "tests/workspace_inputs.rs"

[[test]]
name = "generic_evidence"
path = "tests/generic_evidence.rs"

[[test]]
name = "keygen"
path = "tests/keygen.rs"

[[test]]
name = "parity_drift"
path = "tests/parity_drift.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
indexmap = "2"
jsonwebtoken = { version = "11.1", features = ["aws_lc_rs"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
# Fractal enables this through workspace feature unification; preserve CLI JSON bytes.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
unicode-normalization = "0.1"
zip = { version = "9.2", default-features = false, features = ["deflate-flate2-zlib-rs", "bzip2", "lzma"] }
