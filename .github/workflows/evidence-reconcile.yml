name: Evidence reconcile

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      repo:
        description: Enrolled owner/repository (omit for all)
        required: false
        type: string
      pr:
        description: Open PR number (optionally restricted by repo)
        required: false
        type: string

# Used only to bootstrap the pinned public verifier, never consumer publication.
permissions:
  contents: read
  attestations: read

concurrency:
  group: evidence-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: mergemaster-check-publisher
    timeout-minutes: 45
    steps:
      - name: Validate App bootstrap configuration
        env:
          MERGEMASTER_APP_ID: ${{ vars.MERGEMASTER_APP_ID }}
          MERGEMASTER_APP_PRIVATE_KEY: ${{ secrets.MERGEMASTER_APP_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +x
          export LC_ALL=C
          fail() { printf 'Evidence reconciliation configuration failed: %s\n' "$1" >&2; exit 1; }
          if [[ -z "${MERGEMASTER_APP_ID//[[:space:]]/}" ]]; then
            fail 'MERGEMASTER_APP_ID is missing or empty; set the repository Actions variable to the GitHub App ID (not the installation ID).'
          fi
          id="${MERGEMASTER_APP_ID#"${MERGEMASTER_APP_ID%%[!0]*}"}"
          if [[ ! "$MERGEMASTER_APP_ID" =~ ^[0-9]+$ || -z "$id" || ${#id} -gt 20 ]] ||
             [[ ${#id} -eq 20 && "$id" > 18446744073709551615 ]]; then
            fail 'MERGEMASTER_APP_ID must be a positive decimal integer within the u64 range; use the GitHub App ID (not the installation ID).'
          fi
          if [[ -z "${MERGEMASTER_APP_PRIVATE_KEY//[[:space:]]/}" ]]; then
            fail 'MERGEMASTER_APP_PRIVATE_KEY is missing or empty; set the App private key secret in the mergemaster-check-publisher environment.'
          fi
          if [[ -z "${GH_TOKEN//[[:space:]]/}" ]]; then
            fail 'GH_TOKEN is missing or empty; supply the workflow token for public verifier bootstrap.'
          fi
          if ! printf '%s' "$MERGEMASTER_APP_PRIVATE_KEY" | openssl rsa -check -noout -passin pass: >/dev/null 2>&1; then
            fail 'MERGEMASTER_APP_PRIVATE_KEY must be a valid RSA PEM private key; replace the environment secret with the GitHub App private key.'
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3
      - name: Build reconciler package
        id: reconciler
        shell: bash
        run: |
          package=$(nix build .#evidence-reconciler --no-link --print-out-paths)
          printf 'binary=%s/bin/mergemaster-reconciler\n' "$package" >> "$GITHUB_OUTPUT"
      - name: Reconcile enrolled evidence checks
        env:
          MERGEMASTER_APP_ID: ${{ vars.MERGEMASTER_APP_ID }}
          MERGEMASTER_APP_PRIVATE_KEY: ${{ secrets.MERGEMASTER_APP_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          RECONCILE_REPO: ${{ inputs.repo }}
          RECONCILE_PR: ${{ inputs.pr }}
          RECONCILER_BINARY: ${{ steps.reconciler.outputs.binary }}
        shell: bash
        run: |
          args=()
          if [[ -n "$RECONCILE_REPO" ]]; then args+=(--repo "$RECONCILE_REPO"); fi
          if [[ -n "$RECONCILE_PR" ]]; then args+=(--pr "$RECONCILE_PR"); fi
          "$RECONCILER_BINARY" "${args[@]}"
