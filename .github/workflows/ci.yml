name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3
      - run: nix flake check --print-build-logs
      - run: nix develop -c bash scripts/test-scripts
      - run: nix develop -c python3 tests/test-workflow-adapters.py
      - run: python3 tests/test-release-workflow.py
      - name: Graph-shaped full-check proof
        id: graph-proof
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          package="$(nix build .# --no-link --print-out-paths)"
          nix develop -c python3 tests/test-graph-proof.py \
            --binary "$package/bin/mergemaster" --work-dir "$RUNNER_TEMP/graph-proof"
      - name: Archive Graph proof with Git modes and symlinks intact
        if: always() && matrix.runner == 'ubuntu-24.04' && steps.graph-proof.outcome != 'skipped'
        run: |
          tar -czf "$RUNNER_TEMP/graph-full-check-proof.tar.gz" \
            --exclude='./signing-key' --exclude='./signer.json' \
            -C "$RUNNER_TEMP/graph-proof" .
      - name: Retain Graph store worktree and complete Vitest output
        if: always() && matrix.runner == 'ubuntu-24.04' && steps.graph-proof.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graph-full-check-proof
          path: ${{ runner.temp }}/graph-full-check-proof.tar.gz
          if-no-files-found: error

  publisher-stack:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: provider
        run: echo "commit=$(jq -r '.members["effect-utils"].commit' megarepo.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: overengineeringstudio/effect-utils
          ref: ${{ steps.provider.outputs.commit }}
          path: repos/effect-utils
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: iac/package.json
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: iac
      - run: pnpm test
        working-directory: iac
