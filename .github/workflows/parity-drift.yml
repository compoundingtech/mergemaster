name: Fractal parity drift

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3
      - name: Build the locked Rust package
        run: |
          package="$(nix build .# --no-link --print-out-paths)"
          echo "MERGEMASTER_BIN=$package/bin/mergemaster" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: compoundingtech/fractal
          ref: main
          fetch-depth: 0
          path: upstream-fractal
          persist-credentials: false
      - name: Report newer mapped upstream commits (advisory only)
        continue-on-error: true
        run: '"$MERGEMASTER_BIN" parity-drift --fractal-repo upstream-fractal --report-only'
