name: Fractal parity drift

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: compoundingtech/fractal
          ref: main
          fetch-depth: 0
          path: upstream-fractal
          persist-credentials: false
      - name: Report newer mapped upstream commits (advisory only)
        continue-on-error: true
        run: python3 scripts/parity-drift --fractal-repo upstream-fractal --report-only
