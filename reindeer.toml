# Same non-vendored Reindeer mechanism as effect-utils 9c4ee91c:rust/reindeer.toml.
manifest_path = "Cargo.toml"
third_party_dir = "buck2/dependencies"
vendor = false
precise_srcs = true
license_patterns = ["LICENSE*", "COPYING*", "UNLICENSE*"]
include_top_level = false
unresolved_fixup_error = true
cargo_env = true

[platform.linux-x86_64]
target = "x86_64-unknown-linux-gnu"
execution-platform = true

[platform.linux-arm64]
target = "aarch64-unknown-linux-gnu"
execution-platform = true

[cargo]

[buck]
file_name = "BUCK"
rust_library = "cargo.rust_library"
rust_binary = "cargo.rust_binary"
cxx_library = "cargo.cxx_library"
prebuilt_cxx_library = "cargo.prebuilt_cxx_library"
buildscript_genrule = "buildscript_run"
http_archive = "crate_archive"
buckfile_imports = """
load("@rules//buck2/rust:defs.bzl", "buildscript_run")
load("@prelude//rust:cargo_package.bzl", "cargo")
load("@rules//buck2/rust:crates.bzl", "crate_archive")
"""
generated_file_header = """
# @generated by pinned effect-utils Reindeer from Cargo.toml, Cargo.lock and reindeer.toml.
# Do not edit; regenerate with scripts/buck2-prepare.
"""
